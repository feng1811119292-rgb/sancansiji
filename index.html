<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="三餐四季">
<meta name="theme-color" content="#F7F6F2">
<title>三餐四季</title>
<link rel="apple-touch-icon" href="三餐四季图标.png">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
    background: #F7F6F2; color: #1A1B1C;
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; border: none; background: none; cursor: pointer; }
  input, select { font-family: inherit; font-size: 16px; }

  #app { max-width: 560px; margin: 0 auto; min-height: 100vh; position: relative; }

  /* 顶部栏 */
  .topbar {
    position: sticky; top: 0; z-index: 20;
    background: rgba(247,246,242,0.96); backdrop-filter: blur(10px);
    padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
    border-bottom: 1px solid rgba(0,0,0,0.06);
    display: flex; align-items: center; gap: 10px;
  }
  .topbar .back { font-size: 26px; line-height: 1; color: #1A1B1C; padding: 2px 8px 2px 0; }
  .topbar .title { font-size: 18px; font-weight: 700; flex: 1; min-width: 0; }
  .topbar .sub { font-size: 12px; color: #8A8F98; }

  /* 主内容 */
  .view { display: none; padding: 14px 16px calc(80px + env(safe-area-inset-bottom)); }
  .view.active { display: block; }

  /* 首页 */
  .home-head { padding: 6px 2px 14px; }
  .home-head .app-title { font-size: 26px; font-weight: 800; letter-spacing: 1px; }
  .home-head .app-title .accent { color: #E07B39; }
  .home-head .date-line { font-size: 13px; color: #8A8F98; margin-top: 4px; }
  .today-chip {
    display: inline-block; margin-top: 10px; font-size: 13px; font-weight: 600;
    color: #E07B39; background: rgba(224,123,57,0.12); padding: 5px 12px; border-radius: 999px;
  }
  .cat-grid { display: flex; flex-wrap: wrap; gap: 12px; }
  .cat-card {
    flex: 1 1 42%; min-width: 0; background: #FFFFFF;
    border: 1px solid rgba(0,0,0,0.06); border-radius: 16px; padding: 16px 14px;
    text-align: left;
  }
  .cat-card .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
  .cat-card .name { font-size: 17px; font-weight: 700; margin-top: 10px; display: block; }
  .cat-card .count { font-size: 12px; color: #8A8F98; margin-top: 4px; display: block; }
  .hint { font-size: 12px; color: #8A8F98; margin-top: 18px; line-height: 1.7; }

  /* 菜品网格 */
  .dish-grid { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 12px; }
  .dish {
    flex: 1 1 42%; min-width: 0; background: #FFFFFF; border-radius: 16px; overflow: hidden;
    border: 2px solid transparent;
  }
  .dish.selected { border-color: #E07B39; }
  .dish .photo { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; background: #EFEEE9; display: block; }
  .dish .no-photo { width: 100%; aspect-ratio: 1 / 1; background: #EFEEE9; display: flex; align-items: center; justify-content: center; color: #B5B3AB; font-size: 40px; font-weight: 300; }
  .dish .dname { font-size: 15px; font-weight: 600; padding: 9px 10px; line-height: 1.3; }

  /* 视图模式切换 */
  .mode-bar { display: flex; gap: 6px; margin-bottom: 10px; }
  .mode-btn { flex: 1; font-size: 13px; font-weight: 600; padding: 7px 0; border-radius: 10px; background: #FFFFFF; border: 1px solid rgba(0,0,0,0.08); color: #6B7280; }
  .mode-btn.active { color: #E07B39; background: rgba(224,123,57,0.12); border-color: transparent; }
  .dish-grid.mode-large .dish { flex: 1 1 100%; }
  .dish-grid.mode-large .dish .photo { aspect-ratio: 4 / 3; }
  .dish-grid.mode-large .dish .dname { font-size: 17px; padding: 12px 14px; }
  .dish-grid.mode-small .dish { flex: 1 1 27%; }
  .dish-grid.mode-small .dish .dname { font-size: 13px; padding: 7px 8px; }
  .dish-grid.mode-list .dish { flex: 1 1 100%; display: flex; align-items: center; gap: 12px; }
  .dish-grid.mode-list .dish .photo, .dish-grid.mode-list .dish .no-photo { width: 64px; height: 64px; flex: 0 0 64px; border-radius: 12px; aspect-ratio: auto; }
  .dish-grid.mode-list .dish .no-photo { font-size: 24px; }
  .dish-grid.mode-list .dish .dname { flex: 1; padding: 0; }

  /* 转盘抽奖 */
  .wheel-wrap { display: flex; flex-direction: column; align-items: center; padding-top: 6px; }
  .wheel-box { width: 100%; max-width: 380px; }
  .wheel-box canvas { width: 100%; display: block; }
  .wheel-hint { font-size: 13px; color: #8A8F98; margin-top: 12px; }
  .wheel-result {
    display: none; width: 100%; max-width: 380px; margin-top: 16px;
    background: #FFFFFF; border: 1px solid rgba(0,0,0,0.06); border-radius: 16px; padding: 14px;
  }
  .wheel-result.show { display: flex; align-items: center; gap: 12px; }
  .wheel-result .rphoto { width: 72px; height: 72px; border-radius: 12px; object-fit: cover; background: #EFEEE9; flex: 0 0 72px; }
  .wheel-result .rname { font-size: 17px; font-weight: 700; }
  .wheel-result .rmeta { font-size: 12px; color: #8A8F98; margin-top: 4px; line-height: 1.6; }
  .wheel-result .rbtn { margin-left: auto; flex: 0 0 auto; }
  .empty-tip { text-align: center; color: #8A8F98; font-size: 14px; padding: 48px 0 28px; line-height: 1.8; }
  .empty-tip .btn-line { margin-top: 14px; }

  /* 按钮 */
  .btn {
    display: inline-block; border-radius: 14px; font-size: 15px; font-weight: 600;
    padding: 12px 22px; text-align: center;
  }
  .btn-primary { background: #E07B39; color: #FFFFFF; }
  .btn-primary:disabled { background: #D9D6CE; color: #FFFFFF; }
  .btn-ghost { background: #FFFFFF; color: #1A1B1C; border: 1px solid rgba(0,0,0,0.12); }
  .btn-danger { background: #FFFFFF; color: #E0554B; border: 1px solid rgba(224,85,75,0.35); }

  /* 分类页底部操作栏 */
  .actionbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    max-width: 560px; margin: 0 auto;
    background: rgba(255,255,255,0.97); backdrop-filter: blur(10px);
    border-top: 1px solid rgba(0,0,0,0.06);
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    display: flex; gap: 10px;
  }
  .actionbar .btn { flex: 1; }

  /* 底部导航 */
  .tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    max-width: 560px; margin: 0 auto;
    background: rgba(255,255,255,0.97); backdrop-filter: blur(10px);
    border-top: 1px solid rgba(0,0,0,0.06);
    padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
    display: flex;
  }
  .tab {
    flex: 1; padding: 6px 0; border-radius: 10px; text-align: center;
    font-size: 13px; color: #8A8F98; font-weight: 600;
  }
  .tab .tname { display: block; }
  .tab.active { color: #E07B39; background: rgba(224,123,57,0.10); }

  /* 添加菜 */
  .photo-box {
    width: 100%; aspect-ratio: 1 / 1; max-height: 260px;
    background: #FFFFFF; border: 1.5px dashed #C9C6BD; border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    color: #8A8F98; font-size: 14px; overflow: hidden;
  }
  .photo-box img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .field { margin-top: 16px; }
  .field .label { font-size: 13px; color: #8A8F98; margin-bottom: 6px; display: block; }
  .field input[type="text"] {
    width: 100%; background: #FFFFFF; border: 1px solid rgba(0,0,0,0.10); border-radius: 12px;
    padding: 12px; outline: none;
  }
  .cat-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .cat-row select {
    flex: 1; min-width: 0; background: #FFFFFF; border: 1px solid rgba(0,0,0,0.10);
    border-radius: 12px; padding: 12px; outline: none; color: #1A1B1C;
  }
  .newcat-link { font-size: 13px; color: #E07B39; font-weight: 600; padding: 4px; }
  .newcat-input { display: none; margin-top: 10px; }
  .newcat-input.show { display: flex; gap: 8px; }
  .newcat-input input { flex: 1; min-width: 0; background: #FFFFFF; border: 1px solid rgba(0,0,0,0.10); border-radius: 12px; padding: 10px; }
  .save-btn { width: 100%; margin-top: 22px; }

  /* 记录 */
  .rec-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .rec-head .t { font-size: 17px; font-weight: 700; }
  .rec-list { display: flex; flex-direction: column; gap: 10px; }
  .rec-item {
    display: flex; align-items: center; gap: 12px; background: #FFFFFF;
    border: 1px solid rgba(0,0,0,0.06); border-radius: 14px; padding: 10px;
  }
  .rec-item .thumb { width: 52px; height: 52px; border-radius: 10px; object-fit: cover; background: #EFEEE9; flex: 0 0 52px; }
  .rec-item .no-thumb { width: 52px; height: 52px; border-radius: 10px; background: #EFEEE9; display: flex; align-items: center; justify-content: center; color: #B5B3AB; font-size: 24px; flex: 0 0 52px; }
  .rec-item .body { flex: 1; min-width: 0; }
  .rec-item .rname { font-size: 15px; font-weight: 600; }
  .rec-item .meta { font-size: 12px; color: #8A8F98; margin-top: 3px; }
  .badge { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 999px; margin-right: 6px; vertical-align: 1px; }
  .badge-manual { color: #3E6BC0; background: rgba(62,107,192,0.12); }
  .badge-random { color: #C2501B; background: rgba(224,123,57,0.14); }
  .rec-item .del { flex: 0 0 36px; height: 36px; font-size: 18px; color: #B5B3AB; }

  /* 统计卡片 */
  .stat-card {
    display: flex; gap: 8px; margin-bottom: 12px;
    background: #FFFFFF; border: 1px solid rgba(0,0,0,0.06); border-radius: 14px; padding: 12px 8px;
  }
  .stat { flex: 1; min-width: 0; text-align: center; }
  .stat .v { font-size: 15px; font-weight: 700; color: #E07B39; word-break: break-all; }
  .stat .k { font-size: 11px; color: #8A8F98; margin-top: 3px; }

  /* 菜卡编辑按钮 */
  .dish { position: relative; }
  .edit-btn {
    position: absolute; top: 8px; right: 8px; z-index: 5;
    width: 30px; height: 30px; border-radius: 50%;
    background: rgba(255,255,255,0.94); color: #6B7280; font-size: 15px; font-weight: 600;
    border: 1px solid rgba(0,0,0,0.10);
  }
  .add-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .add-head .t { font-size: 17px; font-weight: 700; }

  /* 分类管理 */
  .mcat-row { display: flex; align-items: center; gap: 8px; padding: 10px 0; border-bottom: 1px solid rgba(0,0,0,0.06); text-align: left; }
  .mcat-name { flex: 1; min-width: 0; font-size: 15px; font-weight: 600; }
  .mcat-count { font-size: 11px; color: #8A8F98; font-weight: 400; margin-left: 6px; }
  .mcat-act { font-size: 13px; font-weight: 600; color: #3E6BC0; background: rgba(62,107,192,0.10); border-radius: 8px; padding: 6px 10px; }
  .mcat-act.del { color: #E0554B; background: rgba(224,85,75,0.10); }
  .mcat-input { flex: 1; min-width: 0; font-size: 15px; padding: 6px 8px; border: 1px solid rgba(0,0,0,0.15); border-radius: 8px; }

  /* 弹层 */
  #overlay {
    display: none; position: fixed; inset: 0; z-index: 50;
    background: rgba(0,0,0,0.45); align-items: center; justify-content: center; padding: 20px;
  }
  #overlay.show { display: flex; }
  .modal {
    width: 100%; max-width: 380px; background: #FFFFFF; border-radius: 18px;
    padding: 20px; text-align: center;
  }
  .modal img.mphoto { width: 100%; max-height: 260px; object-fit: cover; border-radius: 12px; background: #EFEEE9; }
  .modal .no-photo-big { width: 100%; height: 140px; background: #EFEEE9; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #B5B3AB; font-size: 46px; }
  .modal .mtitle { font-size: 19px; font-weight: 700; margin-top: 14px; }
  .modal .msub { font-size: 13px; color: #8A8F98; margin-top: 6px; line-height: 1.7; }
  .modal .mrow { margin-top: 16px; display: flex; gap: 10px; }
  .modal .mrow .btn { flex: 1; }

  /* Toast */
  #toast {
    position: fixed; left: 50%; bottom: calc(110px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    z-index: 60; background: rgba(26,27,28,0.88); color: #FFFFFF; font-size: 14px;
    padding: 10px 18px; border-radius: 999px; opacity: 0; pointer-events: none;
    transition: opacity 0.25s; max-width: 82%; text-align: center;
  }
  #toast.show { opacity: 1; }
</style>
</head>

      cats = JSON.parse(localStorage.getItem(CATS_KEY)) || null;
      dishes = JSON.parse(localStorage.getItem(DISHES_KEY)) || [];
      records = JSON.parse(localStorage.getItem(RECORDS_KEY)) || [];
    } catch (e) {
      cats = null; dishes = []; records = [];
    }
    if (!cats || !Array.isArray(cats) || cats.length === 0) cats = DEFAULT_CATS.slice();
    if (!Array.isArray(dishes)) dishes = [];
    if (!Array.isArray(records)) records = [];
    var vm = null;
    try { vm = localStorage.getItem(VIEWMODE_KEY); } catch (e) { vm = null; }
    viewMode = ['large', 'medium', 'small', 'list'].indexOf(vm) >= 0 ? vm : 'medium';
    var so = null;
    try { so = localStorage.getItem(SOUND_KEY); } catch (e) { so = null; }
    soundOn = so !== 'off';
  }
  function persist() {
    try {
      localStorage.setItem(CATS_KEY, JSON.stringify(cats));
      localStorage.setItem(DISHES_KEY, JSON.stringify(dishes));
      localStorage.setItem(RECORDS_KEY, JSON.stringify(records));
      return true;
    } catch (e) {
      toast('存储空间不足：请删除一些记录或减少照片大小');
      return false;
    }
  }

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  /* ---------- 时间 ---------- */
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function fmtDateTime(ts) {
    var d = new Date(ts);
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) +
      ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }
  function fmtDateLine(d) {
    var weeks = ['日', '一', '二', '三', '四', '五', '六'];
    return (d.getMonth() + 1) + '月' + d.getDate() + '日 星期' + weeks[d.getDay()];
  }
  function isToday(ts) {
    var d = new Date(ts), n = new Date();
    return d.getFullYear() === n.getFullYear() && d.getMonth() === n.getMonth() && d.getDate() === n.getDate();
  }

  /* ---------- 视图切换 ---------- */
  var views = ['home', 'cat', 'wheel', 'records', 'add'];
  function showView(name) {
    views.forEach(function (v) {
      $('view-' + v).classList.toggle('active', v === name);
    });
    var inCat = name === 'cat';
    var inWheel = name === 'wheel';
    $('topbarCat').style.display = inCat ? '' : 'none';
    $('topbarWheel').style.display = inWheel ? '' : 'none';
    $('actionbar').style.display = inCat ? '' : 'none';
    $('tabbar').style.display = (name === 'cat' || name === 'wheel') ? 'none' : '';
    var tabs = document.querySelectorAll('.tab');
    for (var i = 0; i < tabs.length; i++) {
      tabs[i].classList.toggle('active', tabs[i].getAttribute('data-view') === name || ((name === 'cat' || name === 'wheel') && tabs[i].getAttribute('data-view') === 'home'));
    }
    window.scrollTo(0, 0);
  }

  /* ---------- 渲染：首页 ---------- */
  function renderHome() {
    $('dateLine').textContent = fmtDateLine(new Date());
    var todayCount = records.filter(function (r) { return isToday(r.ts); }).length;
    $('todayChip').textContent = todayCount > 0 ? '今日已点 ' + todayCount + ' 次' : '今天还没点菜，来点一顿吧';

    var html = '';
    cats.forEach(function (c) {
      var count = dishes.filter(function (d) { return d.cat === c; }).length;
      var color = CAT_COLORS[c] || '#8A8F98';
      html += '<button class="cat-card" data-cat="' + esc(c) + '">' +
        '<span class="dot" style="background:' + color + ';"></span>' +
        '<span class="name">' + esc(c) + '</span>' +
        '<span class="count">' + count + ' 道菜</span>' +
        '</button>';
    });
    $('catGrid').innerHTML = html;
    var cards = $('catGrid').querySelectorAll('.cat-card');
    for (var i = 0; i < cards.length; i++) {
      cards[i].addEventListener('click', function () {
        openCat(this.getAttribute('data-cat'));
      });
    }
  }

  /* ---------- 分类页 ---------- */
  function openCat(cat) {
    curCat = cat; selectedId = null; nextView = cat;
    renderCat();
    showView('cat');
  }
  function renderCat() {
    $('topbarCatTitle').textContent = curCat;
    var list = dishes.filter(function (d) { return d.cat === curCat; });
    $('topbarCatCount').textContent = list.length + ' 道菜';
    $('btnOrder').disabled = true;
    $('dishGrid').className = 'dish-grid mode-' + viewMode;
    var modeBtns = document.querySelectorAll('#modeBar .mode-btn');
    for (var m = 0; m < modeBtns.length; m++) {
      modeBtns[m].classList.toggle('active', modeBtns[m].getAttribute('data-mode') === viewMode);
    }

    if (list.length === 0) {
      $('dishGrid').innerHTML = '<div class="empty-tip">这个分类还没有菜<br>点下面「添加菜」上传第一道吧</div>';
      return;
    }
    var html = '';
    list.forEach(function (d) {
      var sel = d.id === selectedId ? ' selected' : '';
      html += '<div class="dish' + sel + '" data-id="' + esc(d.id) + '">' +
        '<button class="edit-btn" data-id="' + esc(d.id) + '">✎</button>' +
        (d.photo ? '<img class="photo" src="' + d.photo + '" alt="">' : '<div class="no-photo">菜</div>') +
        '<div class="dname">' + esc(d.name) + '</div>' +
        '</div>';
    });
    $('dishGrid').innerHTML = html;
    var ebtns = $('dishGrid').querySelectorAll('.edit-btn');
    for (var eb = 0; eb < ebtns.length; eb++) {
      ebtns[eb].addEventListener('click', function (e) {
        e.stopPropagation();
        openEditDish(this.getAttribute('data-id'));
      });
    }
    var items = $('dishGrid').querySelectorAll('.dish');
    for (var i = 0; i < items.length; i++) {
      items[i].addEventListener('click', (function (el) {
        return function () {
          var id = el.getAttribute('data-id');
          selectedId = (selectedId === id) ? null : id;
          var all = $('dishGrid').querySelectorAll('.dish');
          for (var j = 0; j < all.length; j++) all[j].classList.remove('selected');
          if (selectedId) el.classList.add('selected');
          $('btnOrder').disabled = !selectedId;
        };
      })(items[i]));
    }
  }

  /* ---------- 记录 ---------- */
  function addRecord(dish, mode) {
    var rec = {
      id: uid(),
      name: dish.name,
      cat: dish.cat,
      photo: dish.photo || '',
      mode: mode,
      ts: Date.now()
    };
    records.push(rec);
    persist();
    return rec;
  }
  /* ---------- 统计 ---------- */
  function computeStats() {
    var now = Date.now();
    var seven = records.filter(function (r) { return now - r.ts < 7 * 86400000; }).length;
    $('st7d').textContent = seven + ' 次';
    var cnt = {};
    records.forEach(function (r) { cnt[r.name] = (cnt[r.name] || 0) + 1; });
    var topName = '', topN = 0;
    for (var k in cnt) {
      if (cnt[k] > topN) { topN = cnt[k]; topName = k; }
    }
    $('stTop').textContent = topName ? topName + ' ×' + topN : '暂无';
    var names = [];
    dishes.forEach(function (d) { if (names.indexOf(d.name) < 0) names.push(d.name); });
    var stale = null, staleDays = -1;
    names.forEach(function (n) {
      var last = null;
      records.forEach(function (r) { if (r.name === n && (!last || r.ts > last)) last = r.ts; });
      if (last) {
        var days = Math.floor((now - last) / 86400000);
        if (days > staleDays) { staleDays = days; stale = n; }
      }
    });
    $('stStale').textContent = stale ? stale + ' ' + staleDays + ' 天' : '暂无';
  }

  function renderRecords() {
    var list = records.slice().sort(function (a, b) { return b.ts - a.ts; });
    computeStats();
    $('recList').innerHTML = '';
    if (list.length === 0) {
      $('recList').innerHTML = '<div class="empty-tip">还没有点菜记录<br>去分类里点一道菜吧</div>';
      return;
    }
    list.forEach(function (r) {
      var div = document.createElement('div');
      div.className = 'rec-item';
      div.setAttribute('data-id', r.id);
      div.innerHTML =
        (r.photo ? '<img class="thumb" src="' + r.photo + '" alt="">' : '<div class="no-thumb">菜</div>') +
        '<div class="body">' +
          '<div class="rname">' + esc(r.name) + '</div>' +
          '<div class="meta"><span class="badge ' + (r.mode === 'random' ? 'badge-random' : 'badge-manual') + '">' + (r.mode === 'random' ? '随机点菜' : '手动点菜') + '</span>' + esc(r.cat) + ' · ' + fmtDateTime(r.ts) + '</div>' +
        '</div>' +
        '<button class="del" data-id="' + esc(r.id) + '">✕</button>';
      $('recList').appendChild(div);
    });
    var dels = $('recList').querySelectorAll('.del');
    for (var i = 0; i < dels.length; i++) {
      dels[i].addEventListener('click', function (e) {
        e.stopPropagation();
        var rid = this.getAttribute('data-id');
        showConfirm('删除这条点菜记录？', function () {
          records = records.filter(function (r) { return r.id !== rid; });
          persist(); sfxDelete(); renderRecords(); toast('已删除');
        });
      });
    }
    var items = $('recList').querySelectorAll('.rec-item');
    for (var j = 0; j < items.length; j++) {
      items[j].addEventListener('click', function () {
        var rid = this.getAttribute('data-id');
        var r = records.filter(function (x) { return x.id === rid; })[0];
        if (r) showDishDetail(r.name, r.cat, r.photo, r.ts, null);
      });
    }
  }

  /* ---------- 点菜 ---------- */
  function orderSelected() {
    var dish = dishes.filter(function (d) { return d.id === selectedId; })[0];
    if (!dish) return;
    addRecord(dish, 'manual');
    sfxSuccess();
    toast('已点：' + dish.name);
    selectedId = null;
    renderCat();
  }
  /* ---------- 转盘抽奖 ---------- */
  var wheelCanvas = null, wheelCtx = null, wheelAngle = 0, spinning = false, wheelDone = false, wheelDishes = [];
  var WHEEL_COLORS = ['#F2B179', '#F5C97B', '#E8836B', '#9BC4E2', '#9AD0B2', '#D9A7C6', '#E7C77E'];

  function getWheelCtx() {
    wheelCanvas = $('wheelCanvas');
    wheelCtx = wheelCanvas.getContext('2d');
    return wheelCtx;
  }

  function drawWheel() {
    var ctx = getWheelCtx();
    var size = 420, cx = 210, cy = 210, R = 210 - 12;
    var n = wheelDishes.length;
    if (n === 0) return;
    ctx.clearRect(0, 0, size, size);
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(wheelAngle);
    var seg = 2 * Math.PI / n;
    for (var i = 0; i < n; i++) {
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, R, i * seg, (i + 1) * seg);
      ctx.closePath();
      ctx.fillStyle = WHEEL_COLORS[i % WHEEL_COLORS.length];
      ctx.fill();
      ctx.strokeStyle = '#FFFFFF';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.save();
      ctx.rotate(i * seg + seg / 2);
      ctx.textAlign = 'right';
      ctx.fillStyle = '#5A4632';
      ctx.font = 'bold 15px "PingFang SC", sans-serif';
      var nm = wheelDishes[i].name;
      if (nm.length > 6) nm = nm.slice(0, 6) + '…';
      ctx.fillText(nm, R - 14, 5);
      ctx.restore();
    }
    ctx.restore();
    ctx.beginPath();
    ctx.arc(cx, cy, R, 0, 2 * Math.PI);
    ctx.strokeStyle = 'rgba(0,0,0,0.10)';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(cx, cy, R * 0.34, 0, 2 * Math.PI);
    ctx.fillStyle = '#FFFFFF';
    ctx.fill();
    ctx.strokeStyle = '#E0DED8';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = '#E07B39';
    ctx.font = 'bold 17px "PingFang SC", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(spinning ? '抽奖中…' : (wheelDone ? '再抽一次' : '开始抽奖'), cx, cy + 6);
    ctx.beginPath();
    ctx.moveTo(cx, 8); ctx.lineTo(cx - 11, 30); ctx.lineTo(cx + 11, 30);
    ctx.closePath();
    ctx.fillStyle = '#E0554B';
    ctx.fill();
  }

  function pointerIdx() {
    var n = wheelDishes.length;
    if (n === 0) return -1;
    var seg = 2 * Math.PI / n;
    var a = ((-Math.PI / 2 - wheelAngle) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI);
    return Math.floor(a / seg);
  }

  function spinWheel() {
    if (spinning) return;
    var n = wheelDishes.length;
    if (n === 0) { toast('这个分类还没有菜'); return; }
    spinning = true;
    wheelDone = false;
    var seg = 2 * Math.PI / n;
    var idx = Math.floor(Math.random() * n);
    var finalPhase = 3 * Math.PI / 2 - (idx * seg + seg / 2);
    var delta = ((finalPhase - (wheelAngle % (2 * Math.PI))) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI);
    var rounds = 5 + Math.floor(Math.random() * 3);
    var target = wheelAngle + rounds * 2 * Math.PI + delta;
    var start = wheelAngle;
    var dur = 3200, t0 = null, lastTick = -1;
    $('wheelHint').textContent = '手气正在酝酿…';
    function frame(ts) {
      if (!t0) t0 = ts;
      var p = Math.min(1, (ts - t0) / dur);
      var ease = 1 - Math.pow(1 - p, 4);
      wheelAngle = start + (target - start) * ease;
      drawWheel();
      var pi = pointerIdx();
      if (pi !== lastTick) { lastTick = pi; sfxTick(); }
      if (p < 1) {
        requestAnimationFrame(frame);
      } else {
        spinning = false;
        wheelDone = true;
        var dish = wheelDishes[idx];
        var rec = addRecord(dish, 'random');
        showWheelResult(rec);
        $('wheelHint').textContent = '抽到了：' + dish.name;
        drawWheel();
        sfxWin();
        toast('已记入点菜记录');
      }
    }
    requestAnimationFrame(frame);
  }

  function showWheelResult(rec) {
    var el = $('wheelResult');
    el.innerHTML =
      (rec.photo ? '<img class="rphoto" src="' + rec.photo + '" alt="">' : '<div class="rphoto" style="display:flex;align-items:center;justify-content:center;font-size:26px;color:#B5B3AB;">菜</div>') +
      '<div style="flex:1;min-width:0;">' +
        '<div class="rname">' + esc(rec.name) + '</div>' +
        '<div class="rmeta"><span class="badge badge-random">随机点菜</span>' + esc(rec.cat) + '<br>' + fmtDateTime(rec.ts) + '</div>' +
      '</div>' +
      '<button class="btn btn-ghost rbtn" id="btnWheelBack2" style="padding:10px 14px;font-size:13px;">返回分类</button>';
    el.classList.add('show');
  }

  function openWheel() {
    wheelDishes = dishes.filter(function (d) { return d.cat === curCat; });
    if (wheelDishes.length === 0) { toast('这个分类还没有菜，先去添加'); return; }
    $('topbarWheelTitle').textContent = '随机抽菜 · ' + curCat;
    $('wheelResult').classList.remove('show');
    $('wheelHint').textContent = '点转盘中间开始抽奖';
    wheelAngle = 0;
    wheelDone = false;
    spinning = false;
    drawWheel();
    showView('wheel');
  }

  function backFromWheel() {
    renderCat();
    showView('cat');
  }

  $('btnWheelBack').addEventListener('click', backFromWheel);
  $('wheelCanvas').addEventListener('click', function (e) {
    if (spinning) return;
    var rect = wheelCanvas.getBoundingClientRect();
    var x = (e.clientX - rect.left) * (420 / rect.width);
    var y = (e.clientY - rect.top) * (420 / rect.height);
    if ((x - 210) * (x - 210) + (y - 210) * (y - 210) < 210 * 0.34 * 210 * 0.34) spinWheel();
  });
  $('wheelResult').addEventListener('click', function (e) {
    if (e.target && e.target.id === 'btnWheelBack2') backFromWheel();
  });

  /* ---------- 弹层 ---------- */
  function showOverlay() { $('overlay').classList.add('show'); }
  function hideOverlay() { $('overlay').classList.remove('show'); }
  function showConfirm(msg, onYes) {
    var box = $('modalBox');
    box.innerHTML =
      '<div class="msub" style="font-size:15px;color:#1A1B1C;line-height:1.7;margin-top:0;">' + esc(msg) + '</div>' +
      '<div class="mrow">' +
        '<button class="btn btn-ghost" data-act="no">取消</button>' +
        '<button class="btn btn-primary" data-act="yes" style="background:#E0554B;">确定</button>' +
      '</div>';
    box.setAttribute('data-cb', '');
    box._onYes = onYes;
    showOverlay();
  }
  function showDishDetail(name, cat, photo, ts, id) {
    var box = $('modalBox');
    var html =
      (photo ? '<img class="mphoto" src="' + photo + '" alt="">' : '<div class="no-photo-big">菜</div>') +
      '<div class="mtitle">' + esc(name) + '</div>' +
      '<div class="msub">' + esc(cat) + '<br>添加时间：' + fmtDateTime(ts) + '</div>';
    if (id) {
      html += '<div class="mrow"><button class="btn btn-danger" data-act="deldish">删除这道菜</button>' +
        '<button class="btn btn-ghost" data-act="close">关闭</button></div>';
    } else {
      html += '<div class="mrow"><button class="btn btn-primary" data-act="close">关闭</button></div>';
    }
    box.innerHTML = html;
    box.setAttribute('data-dish-id', id || '');
    showOverlay();
  }
  $('overlay').addEventListener('click', function (e) {
    var act = e.target.getAttribute('data-act');
    if (!act) { if (e.target === $('overlay')) hideOverlay(); return; }
    if (act === 'close') { hideOverlay(); return; }
    if (act === 'no') { hideOverlay(); return; }
    if (act === 'yes') {
      var cb = $('modalBox')._onYes;
      hideOverlay();
      if (typeof cb === 'function') cb();
      return;
    }
    if (act === 'deldish') {
      var id = $('modalBox').getAttribute('data-dish-id');
      var self = this;
      hideOverlay();
      showConfirm('删除这道菜？它过去点过的记录会保留。', function () {
        dishes = dishes.filter(function (d) { return d.id !== id; });
        persist();
        if (curCat) renderCat(); else renderHome();
        toast('已删除这道菜');
      });
      return;
    }
  });

  /* ---------- 添加菜 ---------- */
  function renderAdd() {
    var sel = $('selCat');
    var prev = sel.value || (nextView ? nextView : cats[0]);
    var html = '';
    cats.forEach(function (c) {
      html += '<option value="' + esc(c) + '">' + esc(c) + '</option>';
    });
    sel.innerHTML = html;
    if (cats.indexOf(prev) >= 0) sel.value = prev;
  }
  function compressImage(file, cb) {
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function () {
      var w = img.naturalWidth, h = img.naturalHeight, max = 480;
      if (w > max || h > max) {
        var r = Math.min(max / w, max / h);
        w = Math.round(w * r); h = Math.round(h * r);
      }
      var c = document.createElement('canvas');
      c.width = w; c.height = h;
      var ctx = c.getContext('2d');
      ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, w, h);
      ctx.drawImage(img, 0, 0, w, h);
      var data = c.toDataURL('image/jpeg', 0.72);
      URL.revokeObjectURL(url);
      cb(data);
    };
    img.onerror = function () { URL.revokeObjectURL(url); cb(null); };
    img.src = url;
  }
  function resetEdit() {
    editDishId = null;
    editingPhoto = null;
    $('inpName').value = '';
    $('photoBox').innerHTML = '<div style="text-align:center;line-height:1.9;">点击添加照片<br><span style="font-size:12px;">可从相册选或拍照</span></div>';
    $('addTitle').textContent = '添加新菜';
    $('btnCancelEdit').style.display = 'none';
    $('btnSave').textContent = '保存这道菜';
    $('btnDelDish').style.display = 'none';
    renderAdd();
  }

  function openEditDish(id) {
    var d = dishes.filter(function (x) { return x.id === id; })[0];
    if (!d) return;
    editDishId = id;
    editingPhoto = d.photo || null;
    $('photoBox').innerHTML = d.photo ? '<img src="' + d.photo + '" alt="">' : '<div style="text-align:center;line-height:1.9;">点击添加照片<br><span style="font-size:12px;">可从相册选或拍照</span></div>';
    $('inpName').value = d.name;
    renderAdd();
    $('selCat').value = d.cat;
    $('addTitle').textContent = '编辑：' + d.name;
    $('btnCancelEdit').style.display = '';
    $('btnSave').textContent = '保存修改';
    $('btnDelDish').style.display = '';
    showView('add');
  }

  function backFromEdit() {
    resetEdit();
    if (curCat) { renderCat(); showView('cat'); }
    else { renderHome(); showView('home'); }
  }
  $('btnCancelEdit').addEventListener('click', backFromEdit);
  $('btnDelDish').addEventListener('click', function () {
    if (!editDishId) return;
    var id = editDishId;
    var d = dishes.filter(function (x) { return x.id === id; })[0];
    var nm = d ? d.name : '这道菜';
    showConfirm('删除「' + nm + '」？它过去点过的记录会保留。', function () {
      dishes = dishes.filter(function (x) { return x.id !== id; });
      persist(); sfxDelete();
      resetEdit();
      if (curCat) { renderCat(); showView('cat'); }
      else { renderHome(); showView('home'); }
      toast('已删除这道菜');
    });
  });

  $('photoBox').addEventListener('click', function () { $('fileInput').click(); });
  $('fileInput').addEventListener('change', function () {
    var f = this.files && this.files[0];
    if (!f) return;
    compressImage(f, function (data) {
      editingPhoto = data;
      $('photoBox').innerHTML = data ? '<img src="' + data + '" alt="">' : '<div style="text-align:center;line-height:1.9;">点击添加照片<br><span style="font-size:12px;">可从相册选或拍照</span></div>';
    });
    this.value = '';
  });
  $('btnNewCat').addEventListener('click', function () {
    var box = $('newcatInput');
    box.classList.toggle('show');
    if (box.classList.contains('show')) $('inpNewCat').focus();
  });
  $('btnNewCatOk').addEventListener('click', function () {
    var name = $('inpNewCat').value.trim();
    if (!name) { toast('请输入分类名称'); return; }
    if (cats.indexOf(name) >= 0) { toast('这个分类已经存在'); return; }
    cats.push(name);
    persist();
    $('newcatInput').classList.remove('show');
    $('inpNewCat').value = '';
    renderAdd();
    $('selCat').value = name;
    toast('已新建分类：' + name);
  });
  $('btnSave').addEventListener('click', function () {
    var name = $('inpName').value.trim();
    var cat = $('selCat').value || cats[0];
    if (!name) { toast('请先填写菜名'); return; }
    if (!editingPhoto) { toast('请先添加一张照片'); return; }
    if (editDishId) {
      var d = dishes.filter(function (x) { return x.id === editDishId; })[0];
      if (!d) { backFromEdit(); return; }
      d.name = name;
      d.cat = cat;
      if (editingPhoto !== d.photo) d.photo = editingPhoto;
      if (!persist()) { return; }
      sfxSuccess();
      toast('已更新：' + name);
      var backCat = d.cat;
      resetEdit();
      openCat(backCat);
      return;
    }
    dishes.push({ id: uid(), name: name, cat: cat, photo: editingPhoto, ts: Date.now() });
    if (!persist()) { dishes.pop(); return; }
    sfxSuccess();
    toast('已保存：' + name);
    resetEdit();
    nextView = cat;
    openCat(cat);
  });

  /* ---------- 顶部/底部事件 ---------- */
  $('btnBack').addEventListener('click', function () {
    renderHome();
    showView('home');
  });
  $('btnOrder').addEventListener('click', orderSelected);
  $('btnRandom').addEventListener('click', openWheel);
  $('btnClearRec').addEventListener('click', function () {
    if (records.length === 0) { toast('记录已经是空的'); return; }
    showConfirm('清空全部点菜记录？', function () {
      records = [];
      persist(); sfxDelete(); renderRecords(); toast('已清空');
    });
  });
  var tabs = document.querySelectorAll('.tab');
  for (var i = 0; i < tabs.length; i++) {
    tabs[i].addEventListener('click', function () {
      var v = this.getAttribute('data-view');
      if (v === 'add') { resetEdit(); showView('add'); }
      else if (v === 'records') { renderRecords(); showView('records'); }
      else { renderHome(); showView('home'); }
    });
  }
  var modeBtns = document.querySelectorAll('#modeBar .mode-btn');
  for (var mi = 0; mi < modeBtns.length; mi++) {
    modeBtns[mi].addEventListener('click', function () {
      viewMode = this.getAttribute('data-mode');
      try { localStorage.setItem(VIEWMODE_KEY, viewMode); } catch (e) {}
      renderCat();
    });
  }

  /* ---------- 分类管理 ---------- */
  function showManageCat() {
    var box = $('modalBox');
    box.innerHTML =
      '<div class="mtitle" style="font-size:17px;">管理分类</div>' +
      '<div style="text-align:left;margin-top:6px;" id="mcatList"></div>' +
      '<div class="mrow" style="margin-top:14px;"><button class="btn btn-ghost" id="mcatClose" style="flex:1;">关闭</button></div>';
    renderMcatList();
    showOverlay();
    $('mcatClose').addEventListener('click', hideOverlay);
  }
  function renderMcatList() {
    var wrap = $('mcatList');
    wrap.innerHTML = '';
    cats.forEach(function (c) {
      var row = document.createElement('div');
      row.className = 'mcat-row';
      row.setAttribute('data-cat', c);
      var count = dishes.filter(function (d) { return d.cat === c; }).length;
      row.innerHTML =
        '<span class="mcat-name">' + esc(c) + '<span class="mcat-count">' + count + ' 道菜</span></span>' +
        '<button class="mcat-act" data-act="rename">改名</button>' +
        '<button class="mcat-act del" data-act="delete">删除</button>';
      wrap.appendChild(row);
    });
    var acts = wrap.querySelectorAll('.mcat-act');
    for (var i = 0; i < acts.length; i++) {
      acts[i].addEventListener('click', function () {
        var act = this.getAttribute('data-act');
        var cat = this.parentNode.getAttribute('data-cat');
        if (act === 'rename') startRenameCat(cat);
        else askDeleteCat(cat);
      });
    }
  }
  function startRenameCat(cat) {
    renderMcatList();
    var rows = $('mcatList').querySelectorAll('.mcat-row');
    var row = null;
    for (var i = 0; i < rows.length; i++) {
      if (rows[i].getAttribute('data-cat') === cat) { row = rows[i]; break; }
    }
    if (!row) return;
    row.innerHTML =
      '<input class="mcat-input" maxlength="10" value="' + esc(cat) + '">' +
      '<button class="mcat-act ok">确定</button>' +
      '<button class="mcat-act" data-act="cancel">取消</button>';
    var inp = row.querySelector('input');
    inp.focus();
    row.querySelector('.mcat-act.ok').addEventListener('click', function () { saveRenameCat(row, cat); });
    row.querySelector('.mcat-act[data-act="cancel"]').addEventListener('click', renderMcatList);
    inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') saveRenameCat(row, cat); });
  }
  function saveRenameCat(row, oldCat) {
    var name = row.querySelector('input').value.trim();
    if (!name) { toast('分类名不能为空'); return; }
    if (name === oldCat) { renderMcatList(); return; }
    if (cats.indexOf(name) >= 0) { toast('已有同名分类'); return; }
    cats[cats.indexOf(oldCat)] = name;
    dishes.forEach(function (d) { if (d.cat === oldCat) d.cat = name; });
    if (curCat === oldCat) curCat = name;
    persist(); sfxClick();
    renderHome();
    renderMcatList();
    toast('已改名：' + name);
  }
  function askDeleteCat(cat) {
    hideOverlay();
    var n = dishes.filter(function (d) { return d.cat === cat; }).length;
    showConfirm('删除分类「' + cat + '」？' + (n ? '下面 ' + n + ' 道菜也会一起删除（点菜记录会保留）。' : ''), function () {
      cats = cats.filter(function (c) { return c !== cat; });
      dishes = dishes.filter(function (d) { return d.cat !== cat; });
      if (curCat === cat) curCat = null;
      persist(); sfxDelete();
      renderHome();
      toast('已删除分类');
      showManageCat();
    });
  }
  $('btnManageCat').addEventListener('click', showManageCat);

  /* ---------- 音效（Web Audio 合成，无需音频文件） ---------- */
  var SOUND_KEY = 'sanCanSiJi_sound_v1';
  var audioCtx = null;
  function getAudioCtx() {
    if (!audioCtx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) {
        try { audioCtx = new AC(); } catch (e) { audioCtx = null; }
      }
    }
    if (audioCtx && audioCtx.state === 'suspended') {
      try { audioCtx.resume(); } catch (e) {}
    }
    return audioCtx;
  }
  function playTone(freq, start, dur, type, vol) {
    var ctx = getAudioCtx();
    if (!ctx) return;
    try {
      var t0 = ctx.currentTime + start;
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = type || 'sine';
      osc.frequency.setValueAtTime(freq, t0);
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(vol || 0.12, t0 + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(t0);
      osc.stop(t0 + dur + 0.03);
    } catch (e) {}
  }
  function sfxClick() { if (!soundOn) return; playTone(1400, 0, 0.05, 'sine', 0.07); }
  function sfxSuccess() { if (!soundOn) return; playTone(880, 0, 0.12, 'sine', 0.12); playTone(1320, 0.10, 0.16, 'sine', 0.12); }
  function sfxDelete() { if (!soundOn) return; playTone(600, 0, 0.12, 'triangle', 0.10); playTone(300, 0.10, 0.22, 'triangle', 0.10); }
  function sfxTick() { if (!soundOn) return; playTone(1900, 0, 0.025, 'square', 0.03); }
  function sfxWin() {
    if (!soundOn) return;
    var seq = [523, 659, 784, 1047];
    for (var i = 0; i < seq.length; i++) playTone(seq[i], i * 0.09, 0.22, 'sine', 0.13);
  }
  function updateSoundBtn() {
    var b = $('btnSound');
    if (b) b.textContent = soundOn ? '音效：开' : '音效：关';
  }
  $('btnSound').addEventListener('click', function () {
    soundOn = !soundOn;
    try { localStorage.setItem(SOUND_KEY, soundOn ? 'on' : 'off'); } catch (e) {}
    updateSoundBtn();
    if (soundOn) sfxClick();
  });

  /* ---------- Toast ---------- */
  var toastTimer = null;
  function toast(msg) {
    var t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, 1800);
  }

  /* ---------- 启动 ---------- */
  load();
  renderHome();
  updateSoundBtn();
  showView('home');
})();
</script>
</body>
</html>
